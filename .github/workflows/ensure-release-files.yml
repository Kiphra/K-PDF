name: Ensure Release Files Complete

on:
  workflow_dispatch:
  schedule:
    # Run weekly to check and fix missing release files
    - cron: '0 0 * * 0'

permissions:
  contents: write
  actions: write

jobs:
  check-and-fix-releases:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Decode Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > keystore.jks
          cp keystore.jks app/keystore.jks

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Check and Fix Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Get all releases
          RELEASES=$(gh release list --limit 100 --json tagName,createdAt --jq 'sort_by(.createdAt) | reverse | .[].tagName')
          
          for TAG in $RELEASES; do
            echo "Checking release: $TAG"
            
            # Check what files exist in the release
            ASSETS=$(gh release view "$TAG" --json assets --jq '.assets[].name' 2>/dev/null || echo "")
            
            HAS_AAB=$(echo "$ASSETS" | grep -c "\.aab$" || echo "0")
            HAS_APK=$(echo "$ASSETS" | grep -c "\.apk$" || echo "0")
            
            echo "  AAB: $HAS_AAB, APK: $HAS_APK"
            
            # If any files are missing, we need to build and upload
            if [ "$HAS_AAB" = "0" ] || [ "$HAS_APK" = "0" ]; then
              echo "  → Missing files detected. Building..."
              
              git checkout "$TAG" -- gradle.properties 2>/dev/null || true
              
              ./gradlew bundleRelease || echo "AAB build failed"
              ./gradlew assembleRelease || echo "APK build failed"
              
              # Upload missing files
              if [ "$HAS_AAB" = "0" ] && [ -f app/build/outputs/bundle/release/app-release.aab ]; then
                echo "  Uploading AAB..."
                gh release upload "$TAG" app/build/outputs/bundle/release/*.aab --clobber || echo "Failed to upload AAB"
              fi
              
              if [ "$HAS_APK" = "0" ]; then
                for apk in app/build/outputs/apk/release/*.apk; do
                  if [ -f "$apk" ]; then
                    echo "  Uploading APK: $apk"
                    gh release upload "$TAG" "$apk" --clobber || echo "Failed to upload APK"
                  fi
                done
              fi
              
              # Clean up for next iteration
              rm -rf app/build/outputs/
            else
              echo "  ✓ All files present"
            fi
          done
          
          echo "=== Release Check Complete ==="
